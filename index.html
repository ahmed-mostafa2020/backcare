<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13213C">
<meta name="description" content="BackCare – رحلة تعافي ظهرك: برنامج منزلي متدرّج 8 أسابيع">
<title>BackCare – رحلة تعافي ظهرك</title>
<script>try{var t=(JSON.parse(localStorage.getItem("backcare.v1")||"{}").settings||{}).theme||"auto";var d=t==="dark"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";if(d)document.querySelector("meta[name=theme-color]").content="#0D1524"}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#13213C;--navy2:#1E3157;--navy3:#2B4170;--navy-btn:#13213C;
  --sage:#8FAE8B;--sage-d:#6E8F6A;--sage-l:#E5EDE2;--sage-xl:#F1F5EF;--sage-ink:#5E7F5A;
  --teal:#2A8C82;--teal-d:#1F6E66;--teal-l:#DCEFEC;--teal-ink:#1A5F58;
  --bg:#F4F2ED;--card:#FFFFFF;--card2:#FAF8F4;--ink:#16223A;--ink2:#3D4760;--muted:#6A7488;--line:#E6E2DA;
  --amber:#D99A3B;--amber-l:#FBF0DC;--amber-ink:#8A5A12;--red:#B8402F;--red-l:#FBE6E2;--red-ink:#9E3526;
  --chip-on:#13213C;--ring-bg:#ECE8E0;--tabs:rgba(255,255,255,.92);--input:#fff;--overlay:rgba(19,33,60,.45);
  --fig1:#EEF3EC;--fig2:#FFFFFF;
  --r:22px;--shadow:0 1px 2px rgba(19,33,60,.05),0 8px 24px rgba(19,33,60,.06);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
[data-theme=dark]{
  --navy-btn:#2C4373;--sage-l:#20322A;--sage-xl:#1A2638;--sage-ink:#A9C7A5;
  --teal:#33A397;--teal-d:#86D8CD;--teal-l:#14363A;--teal-ink:#8ADBD0;
  --bg:#0D1524;--card:#162133;--card2:#1B283D;--ink:#E7ECF3;--ink2:#C3CBD9;--muted:#8E9AB0;--line:#26344C;
  --amber:#E2A84B;--amber-l:#33280F;--amber-ink:#F2C47E;--red:#E0715F;--red-l:#3A1C1A;--red-ink:#F4A496;
  --chip-on:#33A397;--ring-bg:#26344C;--tabs:rgba(17,26,41,.94);--input:#1B283D;--overlay:rgba(0,0,0,.6);
  --fig1:#1C2B41;--fig2:#162133;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.22);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.55;transition:background .25s,color .25s}
body{overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(var(--safe-t) + 16px) 18px calc(var(--safe-b) + 104px)}
h1,h2,h3{margin:0;font-weight:700;line-height:1.3}
h1{font-size:25px}h2{font-size:19px}h3{font-size:16.5px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack>*+*{margin-top:14px}
.gap{height:18px}
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:28px 4px 10px}
.sec-title h2{font-size:18px}
.link{color:var(--teal);font-weight:600;font-size:14.5px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:13px;font-weight:600;background:var(--sage-l);color:var(--sage-ink)}
.pill.teal{background:var(--teal-l);color:var(--teal-ink)}
.pill.amber{background:var(--amber-l);color:var(--amber-ink)}
.pill.navy{background:rgba(255,255,255,.14);color:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:0 22px;border-radius:18px;font-weight:700;font-size:17px;transition:transform .12s,opacity .12s;user-select:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--teal);color:#fff;box-shadow:0 6px 18px rgba(42,140,130,.28)}
.btn.navy{background:var(--navy-btn);color:#fff}
.btn.ghost{background:var(--sage-xl);color:var(--ink);border:1px solid var(--line)}
.btn.light{background:#fff;color:#13213C}
.btn.danger{background:var(--red-l);color:var(--red-ink)}
.btn.block{width:100%}
.btn.sm{min-height:46px;font-size:15px;border-radius:14px;padding:0 16px}
.btn[disabled]{opacity:.4;pointer-events:none}
.icon{width:22px;height:22px;flex:none}
.icon-btn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink);flex:none}

.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:42px;height:42px;border-radius:14px;background:#13213C;display:grid;place-items:center;flex:none}
.date{font-size:13.5px;color:var(--muted)}

.hero{background:radial-gradient(120% 140% at 100% 0%,#2C4A7A 0%,#1E3157 38%,#13213C 100%);color:#fff;border-radius:28px;padding:22px;position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(19,33,60,.25)}
[data-theme=dark] .hero{box-shadow:none;border:1px solid #26344C}
.hero:after{content:"";position:absolute;inset:auto -60px -80px auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(143,174,139,.35),transparent 65%)}
.ring-wrap{position:relative;width:96px;height:96px;flex:none}
.ring-wrap .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:700;font-size:22px;line-height:1.1}
.ring-wrap .val small{display:block;font-size:11px;font-weight:500;opacity:.75}
.weeks{display:flex;gap:5px;margin-top:18px;position:relative;z-index:1}
.weeks i{flex:1;height:7px;border-radius:9px;background:rgba(255,255,255,.16)}
.weeks i.on{background:var(--sage)}
.weeks i.cur{background:#fff}

.next{padding:22px}
.next .eyebrow{font-size:13px;font-weight:700;color:var(--teal);letter-spacing:.2px}
.next h2{font-size:23px;margin-top:4px}
.next .tip{margin-top:12px;font-size:14px;color:var(--muted);text-align:center}
.mini-bar{height:7px;border-radius:9px;background:var(--sage-xl);overflow:hidden;margin-top:12px}
.mini-bar b{display:block;height:100%;background:var(--teal);border-radius:9px;transition:width .4s}

.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:16px 18px;width:100%;text-align:right;min-height:74px}
.li+.li{border-top:1px solid var(--line)}
button.li:active{background:var(--sage-xl)}
.li .ico{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none}
.li .ico.sun{background:var(--amber-l);color:var(--amber-ink)}
.li .ico.moon{background:var(--sage-xl);color:var(--ink2)}
.li .ico.wave{background:var(--teal-l);color:var(--teal-ink)}
.li .ico.heart{background:var(--red-l);color:var(--red-ink)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:16px;font-weight:600}
.li .t span{font-size:13.5px;color:var(--muted)}
.chev{color:var(--muted);width:20px;height:20px}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}
.check.on{background:var(--teal);border-color:var(--teal)}
.tick{min-height:40px;padding:0 14px;border-radius:12px;font-size:14px;font-weight:700;background:var(--teal);color:#fff}
.tick.done{background:var(--sage-xl);color:var(--teal-ink);border:1px solid var(--line)}

.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:18px;font-size:14.5px;margin-top:14px}
.banner.amber{background:var(--amber-l);color:var(--amber-ink)}
.banner.red{background:var(--red-l);color:var(--red-ink)}
.banner.teal{background:var(--teal-l);color:var(--teal-ink)}
.banner b{display:block;margin-bottom:2px}

#tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--tabs);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(var(--safe-b) + 6px);display:flex;justify-content:center}
#tabs .in{display:flex;width:100%;max-width:520px}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:14px}
#tabs button.on{color:var(--ink)}
#tabs button.on .icon{color:var(--teal)}

.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto}
.sheet-bg{position:fixed;inset:0;z-index:60;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(var(--safe-b) + 22px);animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 12px}
.modal-bg{position:fixed;inset:0;z-index:80;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:22px;animation:fade .2s}
.modal{background:var(--card);border-radius:26px;padding:22px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 96px);transform:translateX(-50%) translateY(20px);background:#13213C;color:#fff;padding:11px 18px;border-radius:14px;font-size:14.5px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;text-align:center}
[data-theme=dark] #toast{background:#2C4373}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* onboarding */
.ob{position:fixed;inset:0;z-index:90;background:var(--bg);overflow-y:auto}
.ob .in{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 26px) 22px calc(var(--safe-b) + 24px)}
.ob .dots{display:flex;gap:6px;justify-content:center;margin-bottom:26px}
.ob .dots i{width:8px;height:8px;border-radius:9px;background:var(--line);transition:.25s}
.ob .dots i.on{width:26px;background:var(--teal)}
.ob .body{flex:1}
.ob h1{font-size:27px;text-align:center}
.ob .lead{text-align:center;color:var(--muted);margin-top:8px;font-size:16px}
.feat{display:flex;gap:14px;align-items:center;padding:14px 0}
.feat .ico{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;flex:none}
.ob label.f{display:block;font-weight:600;margin:16px 0 6px}

/* figure */
.fig{position:relative;direction:ltr}
.fig svg{display:block;width:100%;height:100%}
.fig-card{background:linear-gradient(160deg,var(--fig1),var(--fig2) 75%);border-radius:24px;overflow:hidden;aspect-ratio:3/2;border:1px solid var(--line)}
.figbg{background:linear-gradient(160deg,var(--fig1),var(--fig2) 80%)}
[data-theme=dark] .fig .c-hair{fill:#47372C}[data-theme=dark] .fig .c-beard{stroke:#47372C}[data-theme=dark] .fig .c-eye{fill:#2A211C}
[data-theme=dark] .fig .c-mat{fill:#2C4637}[data-theme=dark] .fig .c-mat2{fill:#3A5947}[data-theme=dark] .fig .c-deco{fill:#ffffff;opacity:.05}
[data-theme=dark] .fig .c-ground{stroke:#34445E}[data-theme=dark] .fig .c-shadow{fill:rgba(0,0,0,.28)}

/* library */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;text-align:right;display:block;width:100%}
.tile .fig{aspect-ratio:4/3}
.tile .t{padding:10px 12px 13px}
.tile .t b{display:block;font-size:14.5px;line-height:1.35}
.tile .t span{font-size:12.5px;color:var(--muted)}

/* detail */
.lst{margin:6px 0 0;padding:0 18px 0 0}
.lst li{margin:4px 0}
.box{border-radius:18px;padding:14px 16px}
.box.green{background:var(--sage-xl)}
.box.amber{background:var(--amber-l)}
.box.red{background:var(--red-l)}
.box h3{font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:7px}
details>summary{list-style:none;cursor:pointer;font-weight:700;color:var(--teal);display:flex;align-items:center;justify-content:space-between;gap:10px}
details>summary::-webkit-details-marker{display:none}
details>summary:after{content:"＋";font-size:18px;color:var(--muted)}
details[open]>summary:after{content:"－"}
details.card>summary{color:var(--ink);font-size:16.5px}

/* workout */
.wk{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(var(--safe-t) + 10px) 16px calc(var(--safe-b) + 16px)}
.wk-top{display:flex;align-items:center;gap:12px}
.wk-prog{flex:1;height:8px;border-radius:9px;background:var(--ring-bg);overflow:hidden}
.wk-prog b{display:block;height:100%;background:var(--teal);transition:width .3s}
.wk-fig{margin-top:14px;position:relative}
.wk-fig .side{position:absolute;top:12px;right:12px;z-index:2}
.wk-fig .phase{position:absolute;top:12px;left:12px;z-index:2}
.wk-name{margin-top:14px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.wk-name h1{font-size:23px}
.wk-short{margin-top:6px;color:var(--ink2);font-size:15px}
.timer{display:flex;align-items:center;gap:16px;margin-top:14px;background:var(--card);border-radius:24px;padding:14px 16px;box-shadow:var(--shadow)}
.timer .ring{position:relative;width:96px;height:96px;flex:none}
.timer .ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.timer .lbl{font-size:19px;font-weight:700}
.timer .sub{font-size:14px;color:var(--muted);margin-top:2px}
.ctrls{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:10px;margin-top:auto;padding-top:14px}
.ctrls .btn{min-height:66px;flex-direction:column;gap:2px;font-size:13.5px}
.ctrls .btn.primary{font-size:17px}
.ctrls2{display:flex;gap:10px;margin-top:10px}
.ctrls2 .btn{flex:1}

/* pain */
.pain-num{font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:99px;background:linear-gradient(90deg,#6FAE8F,#E8C25A 50%,#D0573F);outline:none;margin:20px 0 6px;direction:ltr}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:40px;height:40px;border-radius:50%;background:#fff;border:3px solid #13213C;box-shadow:0 3px 10px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid #13213C}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);direction:ltr}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);font-size:14px;font-weight:500}
.chip.on{background:var(--chip-on);border-color:var(--chip-on);color:#fff}
.chip.flag{border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.chip.flag.on{background:var(--red);border-color:var(--red);color:#fff}
textarea,input[type=text],input[type=date],input[type=time],select{width:100%;border:1.5px solid var(--line);background:var(--input);border-radius:14px;padding:12px 14px;font-size:16px;outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--teal)}
textarea{min-height:80px;resize:vertical}
.hist{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px}
.hist .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.hist .b i{display:block;width:100%;max-width:28px;border-radius:9px 9px 5px 5px;min-height:4px}
.hist .b span{font-size:11px;color:var(--muted)}

/* progress */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.stat .v{font-size:30px;font-weight:700;line-height:1.1;margin-top:6px}
.stat .k{font-size:13px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .d{padding:10px 0 8px;border-radius:16px;background:var(--sage-xl)}
.cal .d.today{background:var(--navy-btn);color:#fff}
.cal .d .n{font-size:11.5px;opacity:.75}
.cal .d .dt{font-weight:700;font-size:16px}
.dots{display:flex;justify-content:center;gap:3px;margin-top:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.m{background:var(--amber)}
.dots i.e{background:#6F86B8}
.dots i.s{background:var(--teal)}
.cal .d.today .dots i:not(.m):not(.e):not(.s){background:rgba(255,255,255,.3)}
.legend{display:flex;gap:14px;justify-content:center;margin-top:12px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.phases{display:flex;flex-direction:column;gap:10px}
.ph{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--sage-xl)}
.ph .no{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:700;background:var(--card);flex:none;font-size:14px}
.ph.on{background:var(--navy-btn);color:#fff}
.ph.on .no{background:var(--teal);color:#fff}
.ph.done .no{background:var(--sage);color:#fff}

/* settings */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row label{font-weight:600}
.set-row input[type=time],.set-row input[type=date],.set-row select{width:auto;min-width:130px;padding:9px 12px}
.switch{position:relative;width:54px;height:32px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.switch span:after{content:"";position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--teal)}
.switch input:checked+span:after{right:25px}
.daychips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.daychips .chip{padding:8px 11px;font-size:13.5px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--sage-xl);border:1px solid var(--line);padding:4px;border-radius:16px}
.seg button{min-height:44px;border-radius:12px;font-weight:600;font-size:14.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

.done-hero{text-align:center;padding:30px 10px 10px}
.done-hero .big{width:96px;height:96px;border-radius:32px;background:var(--teal);display:grid;place-items:center;margin:0 auto 16px;box-shadow:0 12px 30px rgba(42,140,130,.35)}
:root{--heart-bg:#F7E4E7;--heart-line:#EBB0B9}[data-theme=dark]{--heart-bg:#2A2133;--heart-line:#5B3A4B}
.heart rect{transition:y .7s cubic-bezier(.2,.8,.2,1)}
.heart.full{animation:beat 1.6s ease-in-out infinite;filter:drop-shadow(0 3px 8px rgba(224,68,92,.35))}

<script>
"use strict";
/* ================== helpers ================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>keyOf(new Date());
const daysBetween=(a,b)=>Math.round((parseKey(b)-parseKey(a))/864e5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const DAY=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const DAYS=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
const WEEK_ORDER=[6,0,1,2,3,4,5];
const LOC='ar-EG-u-nu-latn';
const fmtDate=(d,o)=>d.toLocaleDateString(LOC,o);
function fmt12(hm){const[h,m]=hm.split(':').map(Number);const ap=h<12?'ص':'م';const hh=((h+11)%12)+1;return `${hh}:${pad(m)} ${ap}`}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600)}

/* ================== state ================== */
const KEY='backcare.v1';
function defaults(){return{v:1,settings:{onboarded:false,start:today(),level:1,lastAdv:null,hold:false,morning:'09:00',evening:'21:00',swimDays:[6,1],swimTime:'19:00',sound:true,vibrate:true,notify:false,theme:'auto'},days:{},pain:{},flares:{}}}
let S=defaults();
try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);S={...defaults(),...o,settings:{...defaults().settings,...(o.settings||{})}}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('تعذّر الحفظ على هذا الجهاز')}syncSWConfig()}
function dayRec(k=today()){if(!S.days[k])S.days[k]={morning:{done:[],fin:false},evening:{done:[],fin:false},swim:null};return S.days[k]}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}

/* ================== program ================== */
const PHASES=[
 {n:1,w:'1–2',t:'الحركة اللطيفة والثبات',d:'تحريك هادئ للظهر وتفعيل العضلات العميقة.'},
 {n:2,w:'3–4',t:'التدرّج والثبات',d:'زيادة بسيطة في التكرارات ومدة الثبات.'},
 {n:3,w:'5–6',t:'القوة والتحمّل',d:'مجموعات أكثر لتقوية الجذع والأرداف.'},
 {n:4,w:'7–8',t:'التدرّج الوظيفي',d:'تمارين قريبة من حركتك اليومية.'}];
const phaseOf=L=>L<=2?1:L<=4?2:L<=6?3:4;
const level=()=>S.settings.level;
function calWeek(){return clamp(Math.floor(daysBetween(S.settings.start,today())/7)+1,1,8)}
function painAround(fromDay,toDay){const a=[];for(let i=fromDay;i<=toDay;i++){const k=keyOf(addDays(new Date(),-i));if(S.pain[k])a.push(S.pain[k])}return a}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function worsening(){
  const rec=painAround(0,6),prev=painAround(7,13);
  const ra=avg(rec.map(p=>p.level)),pa=avg(prev.map(p=>p.level));
  let flares=0;for(let i=0;i<7;i++){flares+=S.flares[keyOf(addDays(new Date(),-i))]||0}
  const latest=painAround(0,2)[0];
  const legNew=rec.some(p=>(p.sym||[]).some(s=>SYM_LEG.includes(s)))&&!prev.some(p=>(p.sym||[]).some(s=>SYM_LEG.includes(s)))&&prev.length>0;
  return (ra!=null&&pa!=null&&ra-pa>=1.5)||(latest&&latest.level>=7)||flares>=2||legNew;
}
function updateLevel(){
  const s=S.settings,cw=calWeek();
  if(s.hold||cw<=s.level||s.lastAdv===today())return;
  if(worsening()){S._held=today()}else{s.level=Math.min(8,s.level+1);s.lastAdv=today();S._adv=today()}
  save();
}

function isSwimDay(d=new Date()){return S.settings.swimDays.includes(d.getDay())}

function routine(kind,L=level()){
  const p=phaseOf(L);
  if(kind==='evening')return[
    {id:'walk',min:5,max:5},{id:'tilt',reps:8},{id:'brace',reps:8,hold:5},{id:'hipflexor',hold:20,perSide:true},{id:'breath',min:1,max:2}];
  const W=[[5,10],[8,12],[10,15],[12,20]][p-1];
  const r=[
    {id:'walk',min:W[0],max:W[1]},
    {id:'brace',reps:10,hold:[5,7,8,10][p-1]},
    {id:'tilt',reps:[10,12,12,12][p-1]},
    {id:'heel',reps:[8,10,10,12][p-1],perSide:true},
    {id:'birddog',reps:[6,8,8,10][p-1],hold:[5,5,7,8][p-1],perSide:true},

  if(L>=2)r.push(L===2?{id:'sideplank',reps:1,sets:2,hold:12,perSide:true,optional:true,label:'2 × 10–15 ث لكل جهة'}:
    [null,null,{id:'sideplank',reps:1,sets:2,hold:15,perSide:true,label:'2 × 15–20 ث لكل جهة'},{id:'sideplank',reps:1,sets:3,hold:20,perSide:true},{id:'sideplank',reps:1,sets:3,hold:25,perSide:true,label:'3 × 25–30 ث لكل جهة'}][p]);
  if(p===4)r.push({id:'sts',reps:8,sets:2});
  r.push({id:'hipflexor',hold:[20,20,25,30][p-1],perSide:true},{id:'hamstring',hold:[20,25,30,30][p-1],perSide:true,label:p===1?'15–20 ث لكل جهة':null});
  return r;
}
function targetLabel(it){
  if(it.label)return it.label;
  const ex=EX[it.id];
  if(ex.kind==='timed')return it.min===it.max?`${it.min} دقائق`:`${it.min}–${it.max} دقائق`;
  const side=it.perSide?' لكل جهة':'';
  if(ex.kind==='stretch')return `${it.hold} ث${side}`;
  if(it.reps===1)return `${it.sets} × ${it.hold} ث${side}`;
  let s=it.hold?`${it.reps} × ${it.hold} ث`:`${it.reps} تكرار`;
  s+=side; if(it.sets>1)s=`${it.sets} مجموعات · `+s; return s;
}
function buildSteps(it){
  const ex=EX[it.id];const st=[{k:'ready',d:5,l:'استعد',side:it.perSide?'R':null}];
  if(ex.kind==='timed'){st.push({k:'timed',d:(it.id==='breath'?2:it.min)*60,l:it.id==='breath'?'تنفّس ببطء':'امشِ بخطوات مريحة'});return st}
  const sides=it.perSide?['R','L']:[null];
  if(ex.kind==='stretch'){sides.forEach((s,i)=>{if(i)st.push({k:'rest',d:6,l:'بدّل الجهة',side:s});st.push({k:'stretch',d:it.hold,l:'اثبت مع تنفّس هادئ',side:s})});return st}
  const sets=it.sets||1;
  for(let set=1;set<=sets;set++){
    if(set>1)st.push({k:'rest',d:it.reps===1?20:30,l:'راحة بين المجموعات',side:sides[0],set});
    sides.forEach((s,si)=>{
      if(si)st.push({k:'rest',d:it.reps===1?8:5,l:'بدّل الجهة',side:s,set});
      for(let r=1;r<=it.reps;r++){
        if(it.hold){st.push({k:'hold',d:it.hold,l:'اثبت',side:s,rep:r,set});if(r<it.reps)st.push({k:'rest',d:3,l:'ارتخِ',side:s,rep:r,set})}
        else st.push({k:'tempo',d:ex.tempo||4,l:'ببطء وتحكّم',side:s,rep:r,set});
      }
    });
  }
  return st;
}
const stepsDur=it=>buildSteps(it).reduce((a,s)=>a+s.d,0);

  if(anim==='tempo'){return (1-Math.cos(2*Math.PI*s/3.6))/2}
  const x=s%(anim==='stretch'?6:5);const up=1.1,hold=anim==='stretch'?3:2.2;

let W=null,wakeLock=null;
function startWorkout(kind){
  const items=routine(kind),done=dayRec()[kind].done;
  let idx=items.findIndex(i=>!done.includes(i.id));
  if(idx<0){idx=0;if(dayRec()[kind].fin){dayRec()[kind].done=[];dayRec()[kind].fin=false;save()}}
  W={kind,items,idx,steps:[],si:0,el:0,run:false,last:0,lastSec:-1};
  const o=document.createElement('div');o.className='overlay';o.id='wk';document.body.appendChild(o);document.body.style.overflow='hidden';
  wkLoad();unlockAudio();
  const R=S.resume;
  if(R&&R.d===today()&&R.kind===kind&&W.items[W.idx].id===R.id&&R.si>0&&R.si<W.steps.length){W.si=R.si;W.el=Math.min(R.el||0,W.steps[R.si].d-1);W._k=-1;wkUpdate(true);toast('كمّلنا من مكان ما وقفت 👌')}
  else if(done.length)toast(`هتكمّل من: ${EX[W.items[W.idx].id].name}`);
}
function saveResume(quiet){if(!W||!W.steps.length)return;const it=W.items[W.idx];S.resume={d:today(),kind:W.kind,id:it.id,si:W.si,el:Math.floor(W.el)};if(quiet){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}else save()}
function resumeNote(kind){const R=S.resume;if(!R||R.d!==today()||R.kind!==kind||dayRec()[kind].done.includes(R.id)||!EX[R.id])return '';const it=routine(kind).find(i=>i.id===R.id);if(!it)return '';const st=buildSteps(it)[R.si]||{};const bits=[EX[R.id].name];if(st.rep)bits.push(`تكرار ${st.rep} من ${it.reps}`);if(st.side)bits.push(st.side==='R'?'الجهة اليمنى':'الجهة اليسرى');return `<div class="resume">${ic('play','icon" style="width:16px;height:16px')}<span>هتكمّل من: <b>${bits.join(' · ')}</b></span></div>`}
function wkLoad(){
  const it=W.items[W.idx],ex=EX[it.id];W.steps=buildSteps(it);W.si=0;W.el=0;W.lastSec=-1;
  const o=$('#wk');
  o.innerHTML=`<div class="wk">
   <div class="wk-top"><button class="icon-btn" data-act="wk-close" aria-label="إغلاق">${ic('x')}</button><div class="wk-prog"><b style="width:${(W.idx/W.items.length)*100}%"></b></div><b class="small">${W.idx+1} / ${W.items.length}</b></div>
   <div class="wk-fig"><div class="fig-card"><div class="fig" id="wkfig" style="width:100%;height:100%"></div></div>
     <span class="pill teal side" id="wkside" style="display:none"></span><span class="pill phase" id="wkphase">${W.kind==='morning'?'الصباح':'المساء'}</span></div>
   <div class="wk-name"><div><h1>${ex.name}${it.optional?' <span class="pill amber" style="font-size:12px">اختياري</span>':''}</h1><div class="muted small">${targetLabel(it)}</div></div><button class="btn sm ghost" data-act="detail" data-id="${it.id}">التفاصيل</button></div>
   <p class="wk-short">${ex.short}</p>
   ${it.optional?`<div class="banner amber small" style="margin-top:10px">${ic('info')}<div>نفّذه فقط إذا كان مريحًا. إذا زاد الألم، تخطَّه.</div></div>`:''}
   <div class="timer"><div class="ring" id="wkring"></div><div style="flex:1;min-width:0"><div class="lbl" id="wklbl">استعد</div><div class="sub" id="wksub"></div>
     ${ex.kind==='timed'?`<div class="row" style="margin-top:8px;gap:8px"><button class="btn sm ghost" data-act="wk-min" data-v="-1">− دقيقة</button><button class="btn sm ghost" data-act="wk-min" data-v="1">+ دقيقة</button></div>`:''}</div></div>
   <div class="ctrls">
     <button class="btn ghost" data-act="wk-prev" ${W.idx===0?'disabled':''}>${ic('prev')}السابق</button>
     <button class="btn primary" data-act="wk-toggle" id="wktog">${ic('play')}<span>ابدأ</span></button>
     <button class="btn ghost" data-act="wk-skip">${ic('next')}تخطَّ</button>
   </div>

  </div>`;
  W.fig=new Figure($('#wkfig'),it.id,{mode:'ext'});

function stepT(st,el,anim){
  if(!st)return 0;
  switch(st.k){
    case 'ready':return 0;
    case 'tempo':return (1-Math.cos(2*Math.PI*el/st.d))/2;
    case 'hold':return ease(Math.min(1,el/1));
    case 'stretch':return ease(Math.min(1,el/2));
    case 'rest':{const prev=W.steps[W.si-1];const from=prev&&(prev.k==='hold'||prev.k==='stretch')?1:0;return from*Math.max(0,1-ease(Math.min(1,el/1)))}
    case 'timed':return anim==='breath'?demoT('breath',el):demoT('walk',el);
  }
  return 0;
}
function wkUpdate(force){
  if(!W||!$('#wkring'))return;
  const st=W.steps[W.si];const it=W.items[W.idx];const ex=EX[it.id];
  if(!st)return;
  const demo=!W.run||st.k==='ready'||(st.k==='rest'&&st.d>=5);
  W.fig.draw(demo?demoT(ex.anim,performance.now()/1000):stepT(st,W.el,ex.anim),st.side);
  const left=Math.max(0,st.d-W.el);
  const sec=Math.ceil(left);
  const r=$('#wkring');
  const pct=st.d?W.el/st.d:0;
  if(force||W._k!==W.si){
    r.innerHTML=ring(pct,96,9,st.k==='rest'||st.k==='ready'?'#D99A3B':'#2A8C82','var(--ring-bg)')+'<div class="num" id="wknum"></div>';
    W._k=W.si;
    let lbl=st.l;if(st.k==='timed'&&ex.anim==='breath')lbl='تنفّس';
    $('#wklbl').textContent=lbl;
    const sub=[];
    if(st.rep)sub.push(`تكرار ${st.rep} من ${it.reps}`);
    if(it.sets>1&&st.set)sub.push(`مجموعة ${st.set} من ${it.sets}`);
    if(st.k==='ready')sub.push('التمرين يبدأ تلقائيًا');
    if(st.k==='timed'&&ex.anim==='walk')sub.push(`الهدف ${targetLabel(it)}`);
    $('#wksub').textContent=sub.join(' · ');
    const sd=$('#wkside');if(st.side){sd.style.display='';sd.textContent=st.side==='R'?'الجهة اليمنى':'الجهة اليسرى'}else sd.style.display='none';
  }else{
    const c=r.querySelector('.rg');if(c){const R=(96-9)/2,cc=2*Math.PI*R;c.setAttribute('stroke-dashoffset',(cc*(1-clamp(pct,0,1))).toFixed(2))}
  }
  if(st.k==='timed'&&ex.anim==='breath'){const x=W.el%10;$('#wklbl').textContent=x<4?'شهيق… 🌬️':'زفير ببطء…'}
  const num=$('#wknum');if(num){num.textContent=st.d>=60?`${Math.floor(sec/60)}:${pad(sec%60)}`:sec}
  const tg=$('#wktog');if(tg){const want=W.run?'p':'r';if(tg.dataset.s!==want){tg.dataset.s=want;tg.innerHTML=W.run?ic('pause')+'<span>إيقاف مؤقت</span>':ic('play')+`<span>${W.el>0||W.si>0?'استكمل':'ابدأ'}</span>`}}
  const pb=$('.wk-prog b');if(pb){const tot=W.steps.reduce((a,s)=>a+s.d,0),dn=W.steps.slice(0,W.si).reduce((a,s)=>a+s.d,0)+W.el;pb.style.width=((W.idx+(tot?dn/tot:0))/W.items.length*100)+'%'}
}
function wkTick(ts){
  const dt=W.last?Math.min(.25,(ts-W.last)/1000):0;W.last=ts;
  if(W.run&&W.steps.length){
    const st=W.steps[W.si];W.el+=dt;
    const left=Math.ceil(st.d-W.el);
    if(left!==W.lastSec){W.lastSec=left;if(left<=3&&left>0&&(st.k==='ready'||st.k==='hold'||st.k==='stretch'||(st.k==='rest'&&st.d>=5)))beep(660,.08,.15)}
    if(W.el>=st.d){wkNextStep()}
    if(!W._sv||ts-W._sv>4000){W._sv=ts;saveResume(true)}
  }
  wkUpdate(false);
}
function wkNextStep(){
  W.si++;W.el=0;W.lastSec=-1;
  if(W.si>=W.steps.length){wkComplete();return}
  const st=W.steps[W.si];
  if(st.k==='hold'||st.k==='stretch'||st.k==='timed'){beep(880,.14,.2);buzz(60)}
  else if(st.k==='rest'){beep(520,.12,.16)}
  else if(st.k==='tempo'){beep(740,.06,.12)}
}
function markDone(id){const r=dayRec()[W.kind];if(!r.done.includes(id))r.done.push(id);r.fin=required(W.kind).every(i=>r.done.includes(i.id));save()}
function wkComplete(){
  const it=W.items[W.idx];markDone(it.id);chime();buzz([60,60,120]);if(W.idx<W.items.length-1)celebrate(false);
  if(W.idx>=W.items.length-1){wkFinish();return}
  W.idx++;const keep=W.run;wkLoad();W.run=keep;saveResume();toast('أحسنت 👏 الجاي: '+EX[W.items[W.idx].id].name);
}
function wkFinish(){

   <div class="card" style="margin-top:18px"><h3>كيف الألم الآن؟</h3><div class="row between" style="margin-top:8px"><span class="muted small">حرّك المؤشر</span><b id="fpv" class="pain-num" style="font-size:34px">${(S.pain[today()]||{}).level??2}</b></div>
   <input type="range" min="0" max="10" step="1" value="${(S.pain[today()]||{}).level??2}" id="fpr" aria-label="مستوى الألم"><div class="scale"><span>0</span><span>5</span><span>10</span></div>
   <button class="btn navy block" style="margin-top:14px" data-act="wk-savepain">حفظ وإغلاق</button></div>
   <button class="btn ghost block" style="margin-top:12px" data-act="wk-exit">إغلاق بدون تسجيل</button>
   <p class="muted small" style="text-align:center;margin-top:16px">ألم خفيف ومؤقت (حتى 3 من 10) يهدأ خلال 24 ساعة أمر مقبول. إذا زاد أو امتد للساق، خفّف التمارين.</p></div>`;
  $('#fpr').addEventListener('input',e=>{$('#fpv').textContent=e.target.value;$('#fpv').style.color=painCol(+e.target.value)});
}

/* audio & haptics */
let AC=null;
function unlockAudio(){if(!S.settings.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function beep(f,d=.1,v=.15){if(!S.settings.sound||!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d+.15);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d+.2)}catch(e){}}
function chime(){beep(660,.12,.14);setTimeout(()=>beep(880,.12,.14),130);setTimeout(()=>beep(1175,.2,.12),260)}
function buzz(p){if(S.settings.vibrate&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}
async function requestWake(){try{if('wakeLock' in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}catch(e){}}
function releaseWake(){try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&W){if(W.run){W.run=false}saveResume()}if(document.visibilityState==='visible'){if(W&&W.run)requestWake();if(!W&&tab==='home')render();scheduleLocal()}});

let HID=0;
const HEART='M12 20.6s-7.3-4.4-9.4-9C1.2 8.3 3.1 4.8 6.6 4.8c2.1 0 3.6 1.1 5.4 3 1.8-1.9 3.3-3 5.4-3 3.5 0 5.4 3.5 4 6.8-2.1 4.6-9.4 9-9.4 9z';
function heart(pct,size,o={}){const id='h'+(++HID),p=clamp(pct||0,0,1),y=4.6+16.2*(1-p);
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" class="heart${p>=1?' full':''}" role="img" aria-label="${Math.round(p*100)}%"><defs><clipPath id="${id}"><rect x="0" y="${y.toFixed(2)}" width="24" height="24"/></clipPath><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8494"/><stop offset="1" stop-color="#E0445C"/></linearGradient></defs><path d="${HEART}" style="fill:${o.bg||'var(--heart-bg)'}"/><path d="${HEART}" fill="url(#${id}g)" clip-path="url(#${id})"/><path d="${HEART}" fill="none" style="stroke:${o.line||'var(--heart-line)'}" stroke-width="${o.sw||1}"/></svg>`}
function dayPct(k){const r=S.days[k];if(!r)return 0;const m=required('morning'),e=required('evening');let tot=m.length+e.length,dn=m.filter(i=>r.morning.done.includes(i.id)).length+e.filter(i=>r.evening.done.includes(i.id)).length;if(isSwimDay(parseKey(k))){tot+=4;if(r.swim&&r.swim.done)dn+=4}return tot?Math.min(1,dn/tot):0}
function weekPct(){const t=new Date(),off=WEEK_ORDER.indexOf(t.getDay());let s=0,n=0;for(let i=0;i<=off;i++){const k=keyOf(addDays(t,-i));if(daysBetween(S.settings.start,k)<0)continue;s+=dayPct(k);n++}return n?s/n:0}
function programPct(){let s=0;const n=Math.min(56,daysBetween(S.settings.start,today())+1);for(let i=0;i<n;i++)s+=dayPct(keyOf(addDays(parseKey(S.settings.start),i)));return s/56}
function streak(){let n=0;let d=new Date();const any=k=>dayPct(k)>0||(S.days[k]&&S.days[k].swim&&S.days[k].swim.done);if(!any(keyOf(d)))d=addDays(d,-1);while(any(keyOf(d))){n++;d=addDays(d,-1)}return n}
function viewProgress(){
  const L=level(),cp=phaseOf(L);let fin=0,swims=0;Object.values(S.days).forEach(r=>{if(r.morning.fin)fin++;if(r.evening.fin)fin++;if(r.swim&&r.swim.done)swims++});
  const t=new Date(),off=WEEK_ORDER.indexOf(t.getDay()),gridStart=addDays(t,-off-21);

  <div class="card"><div class="row" style="align-items:flex-start">${big(tp,'النهارده','هدف اليوم')}${big(wp,'الأسبوع ده','متوسط أيامك')}${big(pp,'البرنامج','رحلة 8 أسابيع')}</div></div>
  <div class="stats" style="grid-template-columns:repeat(3,1fr);margin-top:12px">
   <div class="stat"><div class="k">${ic('flame','icon" style="width:16px;height:16px;color:var(--amber)')} أيام ورا بعض</div><div class="v">${streak()}</div></div>
   <div class="stat"><div class="k">روتين مكتمل</div><div class="v">${fin}</div></div>
   <div class="stat"><div class="k">سباحة</div><div class="v">${swims}</div></div>
  </div>
  <div class="sec-title"><h2>أيامك</h2><span class="muted small">دوس على أي يوم</span></div>
  <div class="card"><div class="hcal">${WEEK_ORDER.map(d=>`<div class="hd">${DAYS[d]}</div>`).join('')}
   ${Array.from({length:28},(_,i)=>{const d=addDays(gridStart,i),k=keyOf(d),fut=k>today(),pre=daysBetween(S.settings.start,k)<0,p=dayPct(k);
     return `<button class="hc ${k===today()?'today':''} ${fut||pre?'off':''}" ${fut||pre?'disabled':`data-day="${k}"`}>${heart(fut||pre?0:p,30)}<span>${d.getDate()}</span>${!fut&&!pre&&p>0?`<em>${Math.round(p*100)}%</em>`:''}</button>`}).join('')}
  </div></div>
  <div class="sec-title"><h2>الألم آخر 4 أسابيع</h2></div>
  <div class="card">${painChart()}</div>
  <div class="gap"></div>
  <details class="card"><summary><span style="flex:1">مراحل البرنامج</span></summary><div class="phases" style="margin-top:12px">${PHASES.map(p=>`<div class="ph ${p.n===cp?'on':p.n<cp?'done':''}"><div class="no">${p.n<cp?'✓':p.n}</div><div><b>${p.t}</b><div class="small" style="opacity:.75">الأسابيع ${p.w} · ${p.d}</div></div></div>`).join('')}</div>

}
function openDay(k){

    ${pn?row('pain','heart','الألم',`${pn.level} من 10 · ${painWord(pn.level)}`,false):''}

/* celebration */
function celebrate(big){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:150';document.body.appendChild(c);
  const dpr=Math.min(2,devicePixelRatio||1),W0=innerWidth,H0=innerHeight;c.width=W0*dpr;c.height=H0*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);
  const cols=['#FF5C7A','#FFC94D','#2A8C82','#8FAE8B','#6FA8FF','#FF9F45','#ffffff'];const P=[];
  const burst=(cx,cy,n,sp)=>{for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=sp*(.4+Math.random()*.8);P.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c:cols[i%cols.length],r:2+Math.random()*2.5,t:Math.random()<.5?'c':'r',rot:Math.random()*6})}};
  const rockets=[];
  if(big){for(let i=0;i<6;i++)setTimeout(()=>rockets.push({x:W0*(.2+Math.random()*.6),y:H0,vy:-(9+Math.random()*3),ty:H0*(.18+Math.random()*.25)}),i*330)}
  else{burst(W0/2,H0*.38,70,7)}
  const end=performance.now()+(big?4200:2200);
  (function f(now){x.clearRect(0,0,W0,H0);
    rockets.forEach((r,i)=>{r.y+=r.vy;r.vy*=.985;x.fillStyle='#FFE29A';x.beginPath();x.arc(r.x,r.y,2.6,0,7);x.fill();if(r.y<=r.ty){burst(r.x,r.y,70,6.5);rockets.splice(i,1)}});
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.vx*=.985;p.life-=.012;p.rot+=.2;x.globalAlpha=Math.max(0,p.life);x.fillStyle=p.c;if(p.t==='c'){x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}else{x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.fillRect(-p.r,-p.r/2,p.r*2.2,p.r);x.restore()}});
    x.globalAlpha=1;for(let i=P.length-1;i>=0;i--)if(P[i].life<=0)P.splice(i,1);
    if(now<end||P.length)requestAnimationFrame(f);else c.remove()})(performance.now());
}
function checkDayComplete(){const k=today(),r=dayRec(k);if(dayPct(k)>=1&&!r.cel){r.cel=true;save();setTimeout(()=>{celebrate(true);toast('يوم كامل 100% ❤️ أحسنت!')},400);return true}return false}
function painChart(){
  const pts=[];for(let i=27;i>=0;i--){const k=keyOf(addDays(new Date(),-i));if(S.pain[k])pts.push({i:27-i,v:S.pain[k].level})}
  if(pts.length<2)return `<div class="muted small" style="text-align:center;padding:24px 0">سجّل ألمك يوميًا لتظهر هنا المتابعة.</div>`;
  const w=320,h=150,px=24,py=14,X=i=>px+(w-px*2)*i/27,Y=v=>py+(h-py*2)*(1-v/10);
  const line=pts.map((p,j)=>`${j?'L':'M'}${X(p.i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
  const area=line+` L${X(pts[pts.length-1].i).toFixed(1)} ${h-py} L${X(pts[0].i).toFixed(1)} ${h-py}Z`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;direction:ltr"><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A8C82" stop-opacity=".25"/><stop offset="1" stop-color="#2A8C82" stop-opacity="0"/></linearGradient></defs>
  ${[0,5,10].map(v=>`<line x1="${px}" x2="${w-px}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)"/><text x="${px-8}" y="${Y(v)+4}" font-size="10" fill="#8A93A5" text-anchor="end">${v}</text>`).join('')}
  <path d="${area}" fill="url(#pg)"/><path d="${line}" fill="none" stroke="#2A8C82" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  ${pts.map(p=>`<circle cx="${X(p.i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.6" style="fill:var(--card)" stroke="${painCol(p.v)}" stroke-width="2.2"/>`).join('')}
  <text x="${px}" y="${h-1}" font-size="10" fill="#8A93A5">قبل 4 أسابيع</text><text x="${w-px}" y="${h-1}" font-size="10" fill="#8A93A5" text-anchor="end">اليوم</text></svg>`;
}

function applySetting(k,v){
  const s=S.settings;
  if(k==='level'){s.level=+v;s.lastAdv=today();toast('تم تغيير المستوى للأسبوع '+v)}
  else if(k==='start'){if(!v)return;s.start=v;toast('تم تحديث تاريخ البداية')}
  else{s[k]=v;toast('تم الحفظ')}
  save();scheduleLocal();
}
async function toggleSetting(k,on,el){
  if(k==='notify'&&on){
    if(!('Notification' in window)){el.checked=false;return}
    let p=Notification.permission;if(p==='default')p=await Notification.requestPermission();
    if(p!=='granted'){el.checked=false;toast('لم يتم السماح بالإشعارات');return}
    S.settings.notify=true;save();scheduleLocal();registerPeriodic();toast('تم تفعيل الإشعارات');return;
  }
  S.settings[k]=on;save();if(k==='hold')toast(on?'تم تثبيت المستوى':'التدرّج التلقائي مفعّل');if(k==='sound'&&on)unlockAudio();scheduleLocal();
}
function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

function importData(file){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.settings||!o.days)throw 0;S={...defaults(),...o,settings:{...defaults().settings,...o.settings}};save();toast('تم استرجاع البيانات');render()}catch(e){toast('الملف غير صالح')}};r.readAsText(file)}
function icsFile(){
  const s=S.settings,st=parseKey(today()),ds=keyOf(st).replace(/-/g,'');
  const BY=['SU','MO','TU','WE','TH','FR','SA'];
  const ev=(uid,title,hm,rule,desc)=>{const t=hm.replace(':','')+'00';return `BEGIN:VEVENT\r\nUID:${uid}@backcare\r\nDTSTAMP:${ds}T000000Z\r\nDTSTART;TZID=Africa/Cairo:${ds}T${t}\r\nDURATION:PT${uid==='swim'?'30':'15'}M\r\nRRULE:${rule}\r\nSUMMARY:${title}\r\nDESCRIPTION:${desc}\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${title}\r\nTRIGGER:PT0M\r\nEND:VALARM\r\nEND:VEVENT\r\n`};
  let out='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//BackCare//AR\r\nCALSCALE:GREGORIAN\r\n';
  out+=ev('morning','BackCare – تمارين الصباح',s.morning,'FREQ=DAILY;COUNT=56','افتح تطبيق BackCare وابدأ روتين الصباح');
  out+=ev('evening','BackCare – تمارين المساء',s.evening,'FREQ=DAILY;COUNT=56','روتين المساء الخفيف قبل النوم');
  if(s.swimDays.length)out+=ev('swim','BackCare – السباحة',s.swimTime,`FREQ=WEEKLY;COUNT=${s.swimDays.length*8};BYDAY=${s.swimDays.map(d=>BY[d]).join(',')}`,'سباحة بإيقاع مريح – سجّلها في التطبيق');
  return out+'END:VCALENDAR\r\n';
}

/* ================== reminders ================== */
let timers=[];
function reminderList(d=new Date()){const s=S.settings,k=keyOf(d),r=S.days[k];const l=[
  {id:'morning',hm:s.morning,title:'روتين الصباح 🌿',body:`${routine('morning').length} تمارين · حوالي ${routineMin('morning')} دقيقة`,done:!!(r&&r.morning.fin)},
  {id:'evening',hm:s.evening,title:'روتين المساء 🌙',body:'تمارين خفيفة وتنفّس قبل النوم',done:!!(r&&r.evening.fin)}];
  if(isSwimDay(d))l.push({id:'swim',hm:s.swimTime,title:'وقت السباحة 🏊',body:`${swimMin()} دقيقة بإيقاع مريح`,done:!!(r&&r.swim&&r.swim.done)});return l}
function scheduleLocal(){
  timers.forEach(clearTimeout);timers=[];
  if(!S.settings.notify||!('Notification' in window)||Notification.permission!=='granted')return;
  const now=new Date();
  reminderList().forEach(r=>{const[h,m]=r.hm.split(':').map(Number);const t=new Date();t.setHours(h,m,0,0);const ms=t-now;if(ms>0&&ms<864e5&&!r.done)timers.push(setTimeout(()=>notify(r),ms))});
}
async function notify(r){try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();const o={body:r.body,icon:'icons/icon-192.png',badge:'icons/badge.png',tag:'bc-'+r.id,lang:'ar',dir:'rtl',data:{url:'./#home'}};if(reg)reg.showNotification(r.title,o);else new Notification(r.title,o)}catch(e){}}
async function registerPeriodic(){try{const reg=await navigator.serviceWorker.ready;if('periodicSync' in reg){const st=await navigator.permissions.query({name:'periodic-background-sync'});if(st.state==='granted')await reg.periodicSync.register('bc-reminders',{minInterval:60*60*1000})}}catch(e){}}
async function syncSWConfig(){try{if(!('caches' in window))return;const c=await caches.open('bc-config');const days={};for(let i=0;i<2;i++){const d=addDays(new Date(),i);days[keyOf(d)]=reminderList(d)}await c.put('config.json',new Response(JSON.stringify({notify:S.settings.notify,days}),{headers:{'Content-Type':'application/json'}}))}catch(e){}}

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.set){applySetting(t.dataset.set,t.value);if(t.dataset.set!=='morning'&&t.dataset.set!=='evening'&&t.dataset.set!=='swimTime')render();return}
  if(t.dataset.toggle){toggleSetting(t.dataset.toggle,t.checked,t);return}
  if(t.id==='imp'&&t.files[0]){importData(t.files[0]);t.value=''}
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.some(x=>x[0]===h)&&h!==tab){tab=h;render()}});

/* install */
let deferredInstall=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(!W&&(tab==='home'||tab==='set'))render()});
window.addEventListener('appinstalled',()=>{deferredInstall=null;toast('تم تثبيت BackCare ✓');render()});
async function doInstall(){if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null;render()}

/* boot */
if('serviceWorker' in navigator&&location.protocol==='https:'||location.hostname==='localhost'){if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(()=>{syncSWConfig();if(S.settings.notify)registerPeriodic()}).catch(()=>{})}
applyTheme();render();requestAnimationFrame(loop);scheduleLocal();
if(!S.settings.onboarded)onboarding();
setInterval(()=>{if(!W&&tab==='home'&&!$('#sheet')&&!$('#modal')&&!$('#ob')&&document.visibilityState==='visible'){const sy=scrollY;render();scrollTo(0,sy)}},5*60*1000);
</script>
</body>
</html>
